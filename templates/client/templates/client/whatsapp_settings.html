{% extends "base.html" %}
{% block content %}

<div class="container mt-4">
    <div class="card">
        <div class="card-header bg-success text-white">
            <h4>WhatsApp API Settings</h4>
        </div>
        <div class="card-body">

            <form action="/save-whatsapp-settings" method="POST">

                <div class="mb-3">
                    <label class="form-label">WhatsApp Access Token</label>
                    <input type="text" name="whatsapp_token" 
                           class="form-control"
                           value="{{ current_user.whatsapp_token or '' }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">WhatsApp Phone ID</label>
                    <input type="text" name="whatsapp_phone_id" 
                           class="form-control"
                           value="{{ current_user.whatsapp_phone_id or '' }}"
                           required>
                </div>

                <button type="submit" class="btn btn-success">
                    Save Settings
                </button>

            </form>

        </div>
    </div>
</div>

{% endblock %}
