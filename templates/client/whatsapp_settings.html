{% extends "base.html" %}

{% block title %}WhatsApp Settings{% endblock %}

{% block content %}

<div class="card">
    <div class="card-header bg-success text-white">
        <h5 class="mb-0">WhatsApp API Settings</h5>
    </div>

    <div class="card-body">

        <!-- SAVE SETTINGS FORM -->
        <form method="POST" action="{{ url_for('save_whatsapp_settings') }}">

            <div class="mb-3">
                <label class="form-label">WhatsApp Access Token</label>
                <input type="text"
                       name="whatsapp_token"
                       value="{{ current_user.whatsapp_token or '' }}"
                       class="form-control"
                       placeholder="Enter WhatsApp Access Token"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">WhatsApp Phone Number ID</label>
                <input type="text"
                       name="whatsapp_phone_id"
                       value="{{ current_user.whatsapp_phone_id or '' }}"
                       class="form-control"
                       placeholder="Enter Phone Number ID"
                       required>
            </div>

            <button type="submit" class="btn btn-success">
                Save Settings
            </button>

            <a href="{{ url_for('verify_token') }}" class="btn btn-primary ms-2">
                Verify Token
            </a>

        </form>

        <hr>

        <!-- SEND TEST MESSAGE -->
        <h6 class="mb-3">Send Test Message</h6>

        <form method="POST" action="{{ url_for('send_test_message') }}">

            <div class="mb-3">
                <label class="form-label">Test Number (with country code)</label>
                <input type="text"
                       name="test_number"
                       class="form-control"
                       placeholder="Example: 919876543210"
                       required>
            </div>

            <button type="submit" class="btn btn-warning">
                Send Test Message
            </button>

        </form>

    </div>
</div>

{% endblock %}
